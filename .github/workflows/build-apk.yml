name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-output.log
        continue-on-error: true

      - name: Surface failure as annotations
        if: steps.build.outcome == 'failure'
        run: |
          grep -iE "error|exception|FAILED|what went wrong|caused by" /tmp/gradle-output.log | tail -25 > /tmp/gradle-errors.log || true
          if [ ! -s /tmp/gradle-errors.log ]; then
            tail -25 /tmp/gradle-output.log > /tmp/gradle-errors.log
          fi
          while IFS= read -r line; do
            clean=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::${clean}"
          done < /tmp/gradle-errors.log
          exit 1

      - name: List build outputs
        if: always()
        run: |
          FOUND=$(find app/build -type f \( -name "*.apk" -o -name "*.aab" \) 2>&1)
          TREE=$(find app -maxdepth 4 -type d 2>&1 | tr '\n' ' | ')
          echo "::warning::APK_SEARCH=[${FOUND}] DIR_TREE=[${TREE}]"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kitara-kid-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
